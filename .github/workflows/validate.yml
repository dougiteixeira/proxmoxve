name: "Validate"

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: "Hassfest Validation"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v7"

        - name: "Move HACS manifest out of the Hassfest workspace"
          shell: bash
          run: mv manifest.json "$RUNNER_TEMP/proxmoxve-hacs-manifest.json"

        - name: "Run hassfest validation"
          uses: "home-assistant/actions/hassfest@master"

        - name: "Restore HACS manifest"
          if: always()
          shell: bash
          run: |
            if [[ -f "$RUNNER_TEMP/proxmoxve-hacs-manifest.json" ]]; then
              mv "$RUNNER_TEMP/proxmoxve-hacs-manifest.json" manifest.json
            fi

