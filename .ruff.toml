# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

# The lowest syntax this code may use, deliberately below the runtime.
# Home Assistant 2026.9 needs Python 3.14, but raising this to py314 makes
# the formatter rewrite `except (A, B):` into the 3.14-only `except A, B:`
# (PEP 758) and assume PEP 649 annotations, neither of which buys anything.
target-version = "py313"

[lint]
select = ["ALL"]

ignore = [
    "ARG001", # "unused-argument"
    "ARG004",
    #"ANN101", # Missing type annotation for `self` in method
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203",   # no-blank-line-before-class (incompatible with formatter)
    "D212",   # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter

    # Temporary exceptions for Ruff implementation
    "PERF401", # manual-list-comprehension
    "EXE002",
    "PLR0912",
    "DTZ005",
    "PLR2004",
    "E722",
    "F821",
    "E501",
    "PLR0915",
    "FBT002",
    "PLR0913",
    "ANN001",
    "SIM102",
    "S105",
    "ARG002",
    "BLE001",
    "PERF402",
    "S101",
    "ANN201",
    "PLR0911",
    "C901",

]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25
